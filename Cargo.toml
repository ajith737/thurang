[package]
name = "thurang"
version = "0.1.0"
edition = "2021"
description = "LAN-only WireGuard exit node / subnet router with OTP pairing"
license = "MIT"

[[bin]]
name = "thurang"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
boringtun = "0.7"
tun-rs = { version = "2", features = ["async"] }
spake2 = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
ipnet = { version = "2", features = ["serde"] }
netdev = "0.36"
mdns-sd = "0.13"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
